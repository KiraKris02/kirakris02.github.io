<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПогодаК — Мониторинг погоды</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111827;
            color: #f3f4f6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #9ca3af;
            margin-top: 5px;
        }

        /* Панель настройки API */
        .api-panel {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            border: 1px solid #374151;
        }

        .api-panel input {
            background: #374151;
            border: 1px solid #4b5563;
            padding: 8px 12px;
            color: #fff;
            border-radius: 6px;
            width: 280px;
        }

        .api-panel button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .api-panel button:hover {
            background: #2563eb;
        }

        /* Виджет погоды */
        .weather-widget {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .weather-info h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .temp-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .weather-meta {
            font-size: 0.9rem;
            color: #93c5fd;
        }

        .update-status {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Контейнер для карты осадков */
        .map-widget {
            background: #1f2937;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        .map-widget h3 {
            margin-bottom: 15px;
            color: #f3f4f6;
            font-size: 1.2rem;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 600px) {
            .weather-widget {
                flex-direction: column;
                text-align: center;
            }
            .update-status {
                position: static;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ПогодаК</h1>
        <p>Интерактивный мониторинг погоды и осадков</p>
    </header>

    <div class="api-panel">
        <label for="apiKey">OpenWeather API Ключ:</label>
        <input type="password" id="apiKey" placeholder="Вставьте ваш API ключ сюда...">
        <button onclick="saveApiKey()">Сохранить в Cookie</button>
        <button onclick="clearApiKey()" style="background: #ef4444;">Удалить</button>
    </div>

    <div class="weather-widget">
        <div class="update-status">
            <div class="pulse-dot"></div>
            <span>Обновление каждые 5 сек. Спустя: <span id="timer">0</span>с</span>
        </div>
        
        <div class="weather-info">
            <h2 id="cityName">Химки</h2>
            <div class="weather-meta" id="weatherDesc">Загрузка данных...</div>
            <div class="temp-display" id="tempText">--°C</div>
            <div class="weather-meta">
                Влажность: <span id="humidity">--</span>% | 
                Ветер: <span id="wind">--</span> м/с
            </div>
        </div>
    </div>

    <div class="map-widget">
        <h3>Карта осадков в реальном времени</h3>
        <div class="iframe-container">
            <iframe src="https://yandex.ru/pogoda/ru/himki/maps/nowcast?ll=37.4449_55.8894&z=9" allowfullscreen="true"></iframe>
        </div>
    </div>
</div>

<script>
    // --- РАБОТА С COOKIES ---
    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
        let nameEQ = name + "=";
        let ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
    const COOKIE_NAME = "weather_api_key";
    let timerValue = 0;

    // При загрузке страницы проверяем наличие ключа в куках
    window.onload = function() {
        const savedKey = getCookie(COOKIE_NAME);
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
        
        updateWeather(); // Первый запуск
        
        // Интервал обновления счетчика и запросов (5 секунд)
        setInterval(() => {
            timerValue++;
            document.getElementById('timer').innerText = timerValue;
            
            if (timerValue >= 5) {
                updateWeather();
                timerValue = 0;
            }
        }, 1000);
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            setCookie(COOKIE_NAME, key, 30); // сохраняем на 30 дней
            alert("Ключ успешно сохранен в Cookie! Сейчас данные обновятся.");
            timerValue = 4; // Спровоцировать быстрое обновление погоды
        } else {
            alert("Пожалуйста, введите ключ.");
        }
    }

    function clearApiKey() {
        setCookie(COOKIE_NAME, "", -1); // Удаляем куку
        document.getElementById('apiKey').value = "";
        alert("Ключ удален из Cookie. Переключение в демо-режим.");
        updateWeather();
    }

    // --- ПОЛУЧЕНИЕ ДАННЫХ ИЗ API ---
    function updateWeather() {
        const apiKey = getCookie(COOKIE_NAME);
        const lat = 55.8894; // Координаты Химок из твоей ссылки
        const lon = 37.4449;

        if (!apiKey) {
            // Демонстрационный режим, если ключ не задан в Куках
            generateMockData();
            return;
        }

        // Запрос к бесплатному API OpenWeatherMap по координатам Химок
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ru`;

        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('Неверный API ключ или ошибка сервера');
                return response.json();
            })
            .then(data => {
                document.getElementById('cityName').innerText = data.name + " (API)";
                document.getElementById('tempText').innerText = Math.round(data.main.temp) + "°C";
                document.getElementById('weatherDesc').innerText = data.weather[0].description;
                document.getElementById('humidity').innerText = data.main.humidity;
                document.getElementById('wind').innerText = data.wind.speed;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('weatherDesc').innerText = "Ошибка API. Проверьте ключ в Cookie.";
            });
    }

    // Вспомогательная функция имитации для наглядности работы таймера в 5 секунд
    function generateMockData() {
        // Слегка меняем значения каждые 5 секунд, чтобы было видно автообновление без ключа
        const randomTemp = Math.floor(Math.sin(Date.now() / 5000) * 3) + 18; 
        document.getElementById('cityName').innerText = "Химки (Демо-режим)";
        document.getElementById('tempText').innerText = randomTemp + "°C";
        document.getElementById('weatherDesc').innerText = "Облачно с прояснениями (без API)";
        document.getElementById('humidity').innerText = "65";
        document.getElementById('wind').innerText = "3.4";
    }
</script>

</body>
</html>
