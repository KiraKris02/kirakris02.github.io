<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПогодаК — Мониторинг Химки</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        header p {
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Статус API и Куки */
        .status-panel {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #334155;
            font-size: 0.9rem;
        }

        .badge {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
        }

        /* Виджет погоды */
        .weather-widget {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            position: relative;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .city-name {
            font-size: 2rem;
            font-weight: bold;
        }

        .temp-display {
            font-size: 4rem;
            font-weight: 800;
            margin: 15px 0 5px 0;
        }

        .weather-desc {
            font-size: 1.2rem;
            color: #e0f2fe;
            text-transform: capitalize;
            margin-bottom: 15px;
        }

        .weather-details {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
            color: #bae6fd;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 15px;
        }

        .timer-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.4; }
        }

        /* Карта осадков */
        .map-widget {
            background: #1e293b;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .map-widget h3 {
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .iframe-container {
            width: 100%;
            height: 450px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #475569;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ПогодаК</h1>
        <p>Автоматический мониторинг погоды каждые 5 секунд</p>
    </header>

    <div class="status-panel" id="statusPanel">
        Проверка авторизации API...
    </div>

    <div class="weather-widget">
        <div class="widget-header">
            <div class="city-name">Химки</div>
            <div class="timer-badge">
                <div class="dot"></div>
                <span>Обновление через: <span id="countdown">5</span>с</span>
            </div>
        </div>
        
        <div class="temp-display" id="temp">--°C</div>
        <div class="weather-desc" id="description">Загрузка...</div>
        
        <div class="weather-details">
            <div>Влажность: <span id="humidity">--</span>%</div>
            <div>Ветер: <span id="wind">--</span> м/с</div>
        </div>
    </div>

    <div class="map-widget">
        <h3>Карта осадков и гроз (Радар онлайн)</h3>
        <div class="iframe-container">
            <iframe src="https://embed.windy.com/embed2.html?lat=55.8894&lon=37.4449&zoom=8&level=surface&overlay=rain&menu=&message=&marker=&calendar=&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    // --- УПРАВЛЕНИЕ КУКАМИ ---
    function setCookie(name, value, seconds) {
        let expires = "";
        if (seconds) {
            let date = new Date();
            date.setTime(date.getTime() + (seconds * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
        let nameEQ = name + "=";
        let ca = document.cookie.split(';');
        for(let i=0;i < ca.length;i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
        }
        return null;
    }

    // --- НАСТРОЙКА И КООРДИНАТЫ (Химки) ---
    const LAT = 55.8894;
    const LON = 37.4449;
    let timeLeft = 5;

    // Интерпретатор погодных кодов для бесплатного API Open-Meteo
    function interpretWeatherCode(code) {
        const codes = {
            0: "Ясно",
            1: "Преимущественно ясно", 2: "Переменная облачность", 3: "Пасмурно",
            45: "Туман", 48: "Иней с туманом",
            51: "Легкая морось", 53: "Умеренная морось", 55: "Плотная морось",
            61: "Слабый дождь", 63: "Умеренный дождь", 65: "Сильный дождь",
            71: "Слабый снегопад", 73: "Снегопад", 75: "Сильный снегопад",
            80: "Слабый ливень", 81: "Сильный ливень",
            95: "Гроза", 96: "Гроза с градом"
        };
        return codes[code] || "Облачно";
    }

    // --- ФУНКЦИЯ ЗАПРОСА К API ---
    function fetchWeatherData() {
        // Проверяем/Обновляем куку подтверждения перед каждым циклом запроса
        let apiToken = getCookie("api_verified");
        
        if (!apiToken) {
            // Если куки нет (первый запуск), создаем её для подтверждения сессии API
            setCookie("api_verified", "true", 600); // Создаем на 10 минут
            apiToken = "true";
        }
