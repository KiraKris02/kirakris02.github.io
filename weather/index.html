<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПогодаК</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #111827;
            color: #f3f4f6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #9ca3af;
            margin-top: 5px;
        }

        /* Виджет погоды */
        .weather-widget {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
        }

        .weather-info h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .temp-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .weather-meta {
            font-size: 0.9rem;
            color: #93c5fd;
        }

        .update-status {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Контейнер для динамической карты */
        .map-widget {
            background: #1f2937;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        .map-widget h3 {
            margin-bottom: 15px;
            color: #f3f4f6;
            font-size: 1.2rem;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            z-index: 1;
        }

        .cookie-note {
            font-size: 0.85rem;
            color: #9ca3af;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ПогодаК</h1>
        <p>Интерактивный радар осадков и авто-обновление</p>
    </header>

    <div class="weather-widget">
        <div class="update-status">
            <div class="pulse-dot"></div>
            <span>Обновление через: <span id="timer">5</span>с</span>
        </div>
        
        <div class="weather-info">
            <h2 id="locationName">Определение локации...</h2>
            <div class="weather-meta" id="weatherDesc">Синхронизация данных GPS...</div>
            <div class="temp-display" id="tempText">--°C</div>
            <div class="weather-meta">
                Влажность: <span id="humidity">--</span>% | 
                Ветер: <span id="wind">--</span> м/с
            </div>
        </div>
    </div>

    <div class="map-widget">
        <h3>Карта осадков и ваше местоположение</h3>
        <div id="map"></div>
        <div class="cookie-note">ℹ️ Координаты верифицированы и сохранены в Cookies для мгновенного доступа.</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- РАБОТА С COOKIES ---
    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
        let nameEQ = name + "=";
        let ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    // --- НАСТРОЙКИ И ПЕРЕМЕННЫЕ ---
    let map;
    let userMarker;
    let radarLayer;
    let currentLat = parseFloat(getCookie("user_lat")) || 55.8894; // Дефолт: Химки, если куки пусты
    let currentLon = parseFloat(getCookie("user_lon")) || 37.4449;
    let countdown = 5;

    // --- ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ---
    window.onload = function() {
        initMap();
        getUserLocation(); // Запрашиваем точный GPS
        
        // Цикл автообновления погоды каждые 5 секунд
        setInterval(() => {
            countdown--;
            document.getElementById('timer').innerText = countdown;
            
            if (countdown <= 0) {
                updateWeather(currentLat, currentLon);
                countdown = 5;
            }
        }, 1000);
    };

    // --- ИНИЦИАЛИЗАЦИЯ КАРТЫ ---
    function initMap() {
        // Создаем карту Leaflet
        map = L.map('map').setView([currentLat, currentLon], 10);

        // Добавляем красивую темную подложку для карты (больше подходит стилю)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Ставим маркер-точку пользователя
        updateUserDot(currentLat, currentLon);

        // Загружаем радар осадков RainViewer
        updateRadarLayer();
    }

    // --- ОПРЕДЕЛЕНИЕ ГЕОЛОКАЦИИ ПОЛЬЗОВАТЕЛЯ ---
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;

                    // Сохраняем верифицированную локацию в Куки на 30 дней
                    setCookie("user_lat", currentLat, 30);
                    setCookie("user_lon", currentLon, 30);

                    // Центрируем карту и обновляем точку
                    map.setView([currentLat, currentLon], 11);
                    updateUserDot(currentLat, currentLon);
                    
                    // Сразу обновляем погоду для этого места
                    updateWeather(currentLat, currentLon);
                },
                (error) => {
                    console.log("Доступ к GPS отклонен, используем сохраненные куки или дефолт.");
                    updateWeather(currentLat, currentLon);
                }
            );
        } else {
            updateWeather(currentLat, currentLon);
        }
    }

    // --- ОБНОВЛЕНИЕ СИНЕЙ ТОЧКИ НА КАРТЕ ---
    function updateUserDot(lat, lon) {
        if (userMarker) {
            userMarker.setLatLng([lat, lon]);
        } else {
            // Создаем кастомный маркер в виде яркой светящейся точки геолокации
            userMarker = L.circleMarker([lat, lon], {
                radius: 9,
                color: '#ffffff',
                weight: 2,
                fillColor: '#3b82f6',
                fillOpacity: 1
            }).addTo(map);
            
            userMarker.bindPopup("<b>Вы находитесь здесь</b>").openPopup();
        }
    }

    // --- ПОДКЛЮЧЕНИЕ СЛОЯ ОСАДКОВ ---
    function updateRadarLayer() {
        // Получаем актуальный таймштамп радара, чтобы сетка осадков была свежей
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.radar && data.radar.past) {
                    const latestTs = data.radar.past[data.radar.past.length - 1].time;
                    
                    if (radarLayer) map.removeLayer(radarLayer);

                    // Накладываем полупрозрачный слой дождя/снега поверх карты
                    radarLayer = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${latestTs}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.6
                    }).addTo(map);
                }
            });
    }

    // --- ПОЛУЧЕНИЕ ПОГОДЫ ИЗ БЕСПЛАТНОГО API ---
    function updateWeather(lat, lon) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=auto`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const current = data.current;
                
                document.getElementById('locationName').innerText = `Ваша локация (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
                document.getElementById('tempText').innerText = Math.round(current.temperature_2m) + "°C";
                document.getElementById('humidity').innerText = current.relative_humidity_2m;
                document.getElementById('wind').innerText = current.wind_speed_10m.toFixed(1);
                document.getElementById('weatherDesc').innerText = decodeWmoCode(current.weather_code);
            })
            .catch(err => {
                console.error("Ошибка API:", err);
                document.getElementById('weatherDesc').innerText = "Ошибка обновления данных.";
            });
    }

    // Расшифровка погодных кодов Всемирной метеорологической организации (WMO)
    function decodeWmoCode(code) {
        if (code === 0) return "Ясно ☀️";
        if (code >= 1 && code <= 3) return "Переменная облачность ⛅";
        if (code === 45 || code === 48) return "Туман 🌫️";
        if (code >= 51 && code <= 55) return "Моросящий дождь 🌧️";
        if (code >= 61 && code <= 65) return "Идет дождь 🌧️";
        if (code >= 71 && code <= 75) return "Идет снег ❄️";
        if (code >= 80 && code <= 82) return "Сильный ливень ⛈️";
        return "Облачно ☁️";
    }
</script>

</body>
</html>
