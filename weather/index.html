<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПогодаК — Карта осадков</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Виджет погоды */
        .weather-widget {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
            border: 1px solid #1e293b;
        }

        .weather-info h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #f1f5f9;
        }

        .temp-display {
            font-size: 4rem;
            font-weight: 800;
            margin: 10px 0;
            color: #fff;
        }

        .weather-meta {
            font-size: 0.95rem;
            color: #38bdf8;
        }

        .update-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.8rem;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        /* Контейнер карты */
        .map-widget {
            background: #1e293b;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            position: relative;
        }

        .map-widget h3 {
            margin-bottom: 15px;
            color: #f1f5f9;
            font-size: 1.2rem;
        }

        #map {
            width: 100%;
            height: 550px;
            border-radius: 12px;
            z-index: 1;
        }

        /* Индикатор/Шкала осадков поверх карты */
        .radar-legend {
            position: absolute;
            bottom: 35px;
            left: 30px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            z-index: 1000;
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        .legend-colors {
            display: flex;
            height: 8px;
            width: 150px;
            margin-top: 5px;
            border-radius: 4px;
            background: linear-gradient(to right, #7dd3fc, #3b82f6, #1d4ed8, #22c55e, #eab308, #ef4444);
        }

        .cookie-badge {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }

        @media (max-width: 640px) {
            .weather-widget { padding-top: 50px; }
            .update-status { top: 10px; right: 50%; transform: translateX(50%); width: max-content; }
            .radar-legend { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ПогодаК</h1>
        <p>Русская интерактивная карта и автообновление</p>
    </header>

    <div class="weather-widget">
        <div class="update-status">
            <div class="pulse-dot"></div>
            <span>Обновление через: <b id="timer">5</b>с</span>
        </div>
        
        <div class="weather-info">
            <h2 id="locationName">Определение позиции...</h2>
            <div class="weather-meta" id="weatherDesc">Синхронизация...</div>
            <div class="temp-display" id="tempText">--°C</div>
            <div class="weather-meta" style="color: #94a3b8;">
                Влажность: <span id="humidity" style="color: #fff;">--</span>% | 
                Ветер: <span id="wind" style="color: #fff;">--</span> м/с
            </div>
        </div>
    </div>

    <div class="map-widget">
        <h3>Карта осадков (Радар)</h3>
        <div id="map"></div>
        
        <div class="radar-legend">
            <span>Радар осадков: активен</span>
            <div class="legend-colors"></div>
            <div style="display: flex; justify-content: space-between; margin-top: 2px; color: #94a3b8;">
                <span>Слабый</span>
                <span>Ливень</span>
            </div>
        </div>

        <div class="cookie-badge">⚙️ Координаты сохраняются в Cookies локально в вашем браузере.</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- COOKIES ---
    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/; SameSite=Lax";
    }

    function getCookie(name) {
        let nameEQ = name + "=";
        let ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    // --- ПЕРЕМЕННЫЕ ---
    let map;
    let userMarker;
    let radarLayer;
    
    // Проверка кук на NaN (защита от сбоев)
    let cookieLat = getCookie("pk_lat");
    let cookieLon = getCookie("pk_lon");
    let currentLat = (cookieLat && !isNaN(parseFloat(cookieLat))) ? parseFloat(cookieLat) : 55.8894;
    let currentLon = (cookieLon && !isNaN(parseFloat(cookieLon))) ? parseFloat(cookieLon) : 37.4449;
    
    let refreshTimer = 5;

    // --- СТАРТ ПРИ ЗАГРУЗКЕ ---
    window.onload = function() {
        buildMap();
        syncGeolocation();
        
        // Жесткий таймер обновлений на 5 секунд
        setInterval(() => {
            refreshTimer--;
            document.getElementById('timer').innerText = refreshTimer;
            
            if (refreshTimer <= 0) {
                fetchWeather(currentLat, currentLon);
                fetchRadarData(); 
                refreshTimer = 5;
            }
        }, 1000);
    };

    // --- СБОРКА РУССКОЙ КАРТЫ ---
    function buildMap() {
        // Создаем карту. Отключаем лишнее, чтобы не тормозило
        map = L.map('map', { minZoom: 3, maxZoom: 18 }).setView([currentLat, currentLon], 11);

        // Используем стандартный OSM слой — он полностью на русском языке для русскоязычных регионов
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Отрисовка синего маркера пользователя
        drawUserDot(currentLat, currentLon);
        fetchRadarData();
    }

    // --- ГЕОЛОКАЦИЯ С ТАЙМАУТОМ ---
    function syncGeolocation() {
        if (navigator.geolocation) {
            // Если за 3 секунды браузер не дал ответ (например файл открыт локально), срабатывает отмена
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;

                    setCookie("pk_lat", currentLat, 30);
                    setCookie("pk_lon", currentLon, 30);

                    map.setView([currentLat, currentLon], 12);
                    drawUserDot(currentLat, currentLon);
                    fetchWeather(currentLat, currentLon);
                },
                (error) => {
                    console.log("GPS недоступен, загружаем стандартную карту.");
                    loadDefault();
                },
                { timeout: 3000 } 
            );
        } else {
            loadDefault();
        }
    }

    function loadDefault() {
        map.setView([currentLat, currentLon], 11);
        drawUserDot(currentLat, currentLon);
        fetchWeather(currentLat, currentLon);
    }

    // --- СОЗДАНИЕ СИНЕЙ ТОЧКИ (КАК В НАВИГАТОРЕ) ---
    function drawUserDot(lat, lon) {
        if (userMarker) {
            userMarker.setLatLng([lat, lon]);
        } else {
            // Светящийся синий маркер локации пользователя
            userMarker = L.circleMarker([lat, lon], {
                radius: 9,
                color: '#ffffff',
                weight: 3,
                fillColor: '#0ea5e9',
                fillOpacity: 1
            }).addTo(map);
            
            userMarker.bindPopup("<b>Вы здесь</b>").openPopup();
        }
    }

    // --- ЗАГРУЗКА СЛОЯ ДОЖДЯ/СНЕГА ---
    function fetchRadarData() {
        fetch('https://api.rainviewer.com/public/weather-maps.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.radar && data.radar.past) {
                    const lastTs = data.radar.past[data.radar.past.length - 1].time;
                    
                    if (radarLayer) map.removeLayer(radarLayer);

                    // Накладываем обновляемую сетку осадков
                    radarLayer = L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${lastTs}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.55
                    }).addTo(map);
                }
            })
            .catch(err => console.error("Ошибка радара осадков:", err));
    }

    // --- ЗАПРОС ТЕКУЩЕЙ ПОГОДЫ ---
    function fetchWeather(lat, lon) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=auto`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const current = data.current;
                
                document.getElementById('locationName').innerText = `Координаты: ${lat.toFixed(3)}°, ${lon.toFixed(3)}°`;
                document.getElementById('tempText').innerText = Math.round(current.temperature_2m) + "°C";
                document.getElementById('humidity').innerText = current.relative_humidity_2m;
                document.getElementById('wind').innerText = current.wind_speed_10m.toFixed(1);
                document.getElementById('weatherDesc').innerText = parseWmoCode(current.weather_code);
            })
            .catch(err => {
                console.error("Ошибка погоды:", err);
                document.getElementById('weatherDesc').innerText = "Ошибка обновления данных сети.";
            });
    }

    // Перевод кодов погоды
    function parseWmoCode(code) {
        if (code === 0) return "Ясное небо ☀️";
        if (code >= 1 && code <= 3) return "Переменная облачность ⛅";
        if (code === 45 || code === 48) return "Туман 🌫️";
        if (code >= 51 && code <= 55) return "Морось 🌧️";
        if (code >= 61 && code <= 65) return "Дождь 🌧️";
        if (code >= 71 && code <= 75) return "Снег ❄️";
        if (code >= 80 && code <= 82) return "Ливень ⛈️";
        return "Облачно ☁️";
    }
</script>

</body>
</html>
